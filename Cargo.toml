[package]
name = "led-lantern"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", features = ["sink"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "query"] }
rumqttc = { version = "0.25.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs", "signal", "net", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }


[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
rpi-led-matrix-sys = "0.2.1"

[target.'cfg(not(all(target_os = "linux", target_arch = "aarch64")))'.dependencies]
rpi-led-matrix-sys = { version = "0.2.1", features = ["c-stubs"] }
